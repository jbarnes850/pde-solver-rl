[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rlvp-source-reproduction"
version = "0.1.0"
description = "Reinforcement learning against a physics verifier for numerical PDE solver generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.3,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.16,<1.18",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
rlvp-verifier = "rlvp.verifier_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rlvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py312"
